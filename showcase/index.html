*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
}
/* 背景：水墨横幅当壁纸。用固定伪元素而不是 background-attachment: fixed，
   后者在 iOS Safari 上滚动会抖。第一层淡纸色是蒙版，用来把画面压淡。 */
body::before{
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background-color: var(--paper);
  background-image:
    linear-gradient(rgb(246 242 233 / .46), rgb(246 242 233 / .54)),
    url('images/bg.webp');
  background-position: center 40%, center 40%;
  background-size: cover, cover;
  background-repeat: no-repeat, no-repeat;
}
button{ font: inherit; color: inherit; cursor: pointer; }
:focus-visible{ outline: 2px solid var(--seal); outline-offset: 2px; border-radius: 4px; }

/* ---------- 页头 ---------- */
.hero{
  max-width: 1240px; margin: 0 auto;
  padding: 46px 24px 26px;
  position: relative;
}
.hero__eyebrow{
  margin: 0 0 10px;
  font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-soft);
}
.hero__title{
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(30px, 5vw, 46px);
  font-weight: 500; letter-spacing: .1em;
}
.hero__sub{ margin: 12px 0 0; color: var(--ink-soft); font-size: 14px; }
.hero__stats{
  margin: 18px 0 0; padding-top: 14px;
  border-top: 1px solid var(--line);
  max-width: 460px;
  color: var(--ink-soft); font-size: 13px; letter-spacing: .08em;
}
.seal{
  position: absolute; top: 44px; right: 26px;
  width: 66px; height: 66px;
  background: var(--seal-img) center / contain no-repeat;
  opacity: .88; transform: rotate(-4deg);
  pointer-events: none; user-select: none;
}

/* ---------- 工具栏 ---------- */
.toolbar{
  position: sticky; top: 0; z-index: 20;
  max-width: 1240px; margin: 0 auto;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--paper) 72%, transparent);
  backdrop-filter: blur(14px) saturate(1.05);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
}
.toolbar__row{ display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search{ flex: 1; min-width: 0; }
.search input{
  width: 100%; padding: 10px 16px;
  -webkit-appearance: none; appearance: none;
  border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--card) 55%, transparent);
  backdrop-filter: blur(8px);
  font: inherit; font-size: 14px; color: var(--ink);
}
.search input::placeholder{ color: color-mix(in srgb, var(--ink-faint) 90%, transparent); }
.toolbar__toggle{ display: inline-flex; align-items: center; gap: 5px; }
.btn-ghost{
  padding: 8px 16px;
  border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--card) 62%, transparent);
  backdrop-filter: blur(8px);
  font-size: 13px; color: var(--ink-soft); white-space: nowrap;
}
.btn-ghost:hover{ border-color: var(--ink-faint); color: var(--ink); }
.badge{
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--seal); color: #fff;
  font-size: 11px; line-height: 16px; text-align: center;
}
.toolbar__more{ display: none; }
.toolbar__more.is-open{ display: block; margin-top: 10px; }
.filters{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.filters__label{ align-self: center; font-size: 12px; letter-spacing: .16em; color: var(--ink-faint); }
.chip{
  padding: 5px 13px; border: 1px solid var(--line); border-radius: 999px;
  background: color-mix(in srgb, var(--card) 55%, transparent);
  font-size: 13px; color: var(--ink-soft);
}
.chip[aria-pressed="true"]{ background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip small{ opacity: .55; margin-left: 4px; font-size: 11px; }
select{
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); font: inherit; font-size: 13px; color: var(--ink-soft);
  cursor: pointer;
}

/* ---------- 作品列表：三列瀑布流 ---------- */
/* 内容长短不一，用 CSS 多列最省事（和原版一致）。
   代价：阅读顺序是「先填满第一列再第二列」，不是从左到右逐行；
   作品按时间是纵向连续的，所以这里可以接受。
   列数不用写媒体查询：column-width 会自动决定能放几列。 */
.list{
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 24px 64px;
  column-count: 3;
  column-width: 320px;
  column-gap: 22px;
}

.work{
  break-inside: avoid;      /* 关键：不让一张卡片被拆到两列 */
  margin: 0 0 22px;
  padding: 18px 18px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, border-color .2s;
}
.work:hover{ border-color: #d8cfbc; box-shadow: 0 8px 22px rgb(60 50 30 / .09); }
.work__thumb{
  border-radius: 8px;
  overflow: hidden;
  background: #f3ede0;
  aspect-ratio: 4 / 5;
  margin-bottom: 14px;
  box-shadow: inset 0 0 0 1px rgb(122 104 74 / .12);
}
.work__thumb img{ display: block; width: 100%; height: 100%; object-fit: cover; }

/* 标题行：标题 + 作者在左（作者用另一档字号），点赞/评论数在右。
   数量只做展示，功能键在卡片下方。 */
.work__head{ display: flex; align-items: baseline; gap: 9px; }
.work__title{
  margin: 0;
  flex: 0 1 auto; min-width: 0;
  font-family: var(--serif);
  font-size: 20px; font-weight: 500; letter-spacing: .05em;
}
/* 作者：比标题小一档（20px → 13px），并换成无衬线、降一级颜色，

.work__author{
  flex: 0 0 auto;

  letter-spacing: .08em;
  color: var(--ink-faint);
}

}
.work__counts b{
  font-weight: 600; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
/* 编码：后端给的唯一编号，等宽字体显示便于核对 */
.work__code{
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px; color: var(--ink-faint);

.work__meta{

.work__audit[data-s="approved"]{ color: var(--ok); }

/* 内容：后端存的是 HTML，这里直接渲染。

.work__content{
  font-family: var(--serif);

/* 正文里的搜索命中：只包文本节点，不碰标签，所以不会切坏 HTML */
.work__content mark, .work__title mark{
  padding: 0 1px; border-radius: 3px;

  color: inherit; font-weight: inherit;
}
/* 诗词以外的文字（序、后记、自注）左侧加一条竖线以示区分。

<script>
/* ============================================================
   存储层：点赞与评论
   ------------------------------------------------------------
   ⚠️ 演示版：只存在访问者自己的浏览器里，换人换设备各看各的。
      接后端时把 Store 换成接口请求，UI 逻辑不用动。
   ============================================================ */
const STORE_KEY = 'dongting-shishe:showcase:v1';
const Store = {
  data: {},
  load(){ try { this.data = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { this.data = {}; } },
  save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch {} },
  of(code){ return this.data[code] || (this.data[code] = { liked:false, marked:false, extraLikes:0, myComments:[] }); },
  toggleLike(code){ const s = this.of(code); s.liked = !s.liked; this.save(); return s; },
  toggleMark(code){ const s = this.of(code); s.marked = !s.marked; this.save(); return s; },
  addComment(code, name, text){
    const s = this.of(code);
    s.myComments.push({ user: name || '匿名', text, at: new Date().toISOString().slice(0,16).replace('T',' ') });
    this.save(); return s;
  }
};
Store.load();

/* 后端给的 likes 是基准值，本机点赞在此之上叠加 */
const likeCount = w => w.likes + (Store.of(w.code).extraLikes || 0) + (Store.of(w.code).liked ? 1 : 0);
const allComments = w => [...w.comments, ...Store.of(w.code).myComments];
const cmtCount = w => allComments(w).length;

const state = { q:'', year:'全部', audit:'全部', sort:'time' };

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* 内容摘出来做搜索用：HTML 去掉标签后的纯文本 */
function plain(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g, ' ');
}

function terms(){ return state.q.trim().toLowerCase().split(/\s+/).filter(Boolean); }

function match(w){
  if (state.year  !== '全部' && w.time.slice(0,4) !== state.year) return false;
  if (state.audit !== '全部' && auditLabel(w.audit.status) !== state.audit) return false;
  const ts = terms();
  if (!ts.length) return true;
  const hay = (w.title + ' ' + w.code + ' ' + plain(w.content)).toLowerCase();
  return ts.every(t => hay.includes(t));
}

const SORTS = {
  time:     (a, b) => b.time.localeCompare(a.time),
  likes:    (a, b) => likeCount(b) - likeCount(a),
  comments: (a, b) => cmtCount(b) - cmtCount(a)
};

const AUDIT = { approved:'已通过审核', pending:'待审核', rejected:'未通过' };
const auditLabel = s => AUDIT[s] || s;

function hl(text, ts){
  let out = esc(text);
  ts.forEach(t => {
    if (!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.split(re).map((p, i) => i % 2 ? `<mark>${p}</mark>` : p).join('');
  });
  return out;
}

/* 正文里的搜索高亮。
   ⚠️ 不能对 HTML 字符串用正则包 <mark> —— 那会把标签切开（字符跨到标签里就废了）。
      正确做法是**只遍历文本节点**，在文本层替换，标签完全不受影响。 */
function highlightIn(root, ts){
  if (!ts.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  for (const node of nodes){
    const text = node.nodeValue, low = text.toLowerCase();
    const ranges = [];
    for (const t of ts){
      let p = low.indexOf(t);
      while (p >= 0){ ranges.push([p, p + t.length]); p = low.indexOf(t, p + 1); }
    }
    if (!ranges.length) continue;

    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges){
      const last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push(r.slice());
    }

    const frag = document.createDocumentFragment();
    let i = 0;
    for (const [s, e] of merged){
      if (s > i) frag.appendChild(document.createTextNode(text.slice(i, s)));
      const m = document.createElement('mark');
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      i = e;
    }
    if (i < text.length) frag.appendChild(document.createTextNode(text.slice(i)));
    node.parentNode.replaceChild(frag, node);
  }
}

/* ---------- 渲染 ---------- */
function render(){
  const ts = terms();
  const list = WORKS.filter(match).sort(SORTS[state.sort] || SORTS.time);
  const box = $('#list');

  box.innerHTML = list.map(w => {
    const st = Store.of(w.code);
    const n  = cmtCount(w);
    return `
    <article class="work" data-code="${esc(w.code)}">
      <div class="work__thumb"><img src="${esc(w.thumb)}" alt="" loading="lazy" decoding="async"></div>
      <div>
        <div class="work__head">
          <h2 class="work__title">${hl(w.title, ts)}</h2>
          ${w.author ? `<span class="work__author">${esc(w.author)}</span>` : ''}
          <span class="work__counts">
            <span title="点赞数">赞 <b>${likeCount(w)}</b></span>
            <span title="评论数">评 <b>${n}</b></span>
          </span>
        </div>
        <div class="work__meta">
          <span class="work__code">${esc(w.code)}</span>
          <time>${esc(w.time)}</time>
          <span class="work__audit" data-s="${esc(w.audit.status)}">${esc(auditLabel(w.audit.status))}</span>
        </div>
        <div class="work__content">${w.content}</div>
        <button type="button" class="work__more" data-act="more" hidden>展开全文</button>
        <div class="work__actions">
          <button type="button" class="act" data-act="like" aria-pressed="${st.liked}">点赞</button>
          <button type="button" class="act" data-act="mark" aria-pressed="${!!st.marked}">收藏</button>
          <button type="button" class="act" data-act="copy">复制</button>
          <button type="button" class="act" data-act="cmt" aria-pressed="false">评论</button>
        </div>
        <section class="cmt" data-cmt hidden>
          <ul class="cmt__list"></ul>
          <form class="cmt__form">
            <input maxlength="12" placeholder="你的名字（可留空）" autocomplete="off">
            <textarea maxlength="200" rows="3" placeholder="说点什么…（最多 200 字）"></textarea>
            <div class="cmt__foot">
              <span class="cmt__hint">演示版：评论只保存在你自己的浏览器里，别人看不到</span>
              <button type="submit" class="btn-ghost">发表</button>
            </div>
          </form>
        </section>
      </div>
    </article>`;
  }).join('');

  $('#empty').hidden = list.length > 0;
  $('#stats').textContent = `共 ${WORKS.length} 篇 · 已通过 ${WORKS.filter(w => w.audit.status==='approved').length} 篇`;
  updateBadge();
  // 正文重绘完再做高亮。render() 每次都用原始 HTML 重建卡片，
  // 所以不会叠加出嵌套的 <mark>。
  if (ts.length) list.forEach(w => {
    const c = cardOf(w.code)?.querySelector('.work__content');
    if (c) highlightIn(c, ts);
  });
  list.forEach(w => { renderComments(w.code); applyClamp(w.code); });
}

/* 折叠：按**实测高度**决定，不数行数 —— 内容是 HTML，行数算不准 */
function applyClamp(code){
  const card = cardOf(code);
  if (!card) return;
  const box  = card.querySelector('.work__content');
  const more = card.querySelector('[data-act="more"]');
  box.classList.remove('is-clamped');
  box.style.removeProperty('--clamp-h');
  const lh  = parseFloat(getComputedStyle(box).lineHeight) || 33;
  const max = lh * 6;                       // 超过 6 行就折叠
  if (box.scrollHeight > max + 2){
    box.style.setProperty('--clamp-h', max + 'px');
    box.classList.add('is-clamped');
    more.hidden = false;
    more.textContent = '展开全文';
    more.setAttribute('aria-expanded', 'false');
  } else {
    more.hidden = true;
  }
}

const cardOf = code => $$('.work').find(c => c.dataset.code === code);

function renderComments(code){
  const card = cardOf(code);
  if (!card) return;
  const w = WORKS.find(x => x.code === code);
  const list = allComments(w);
  const ul = card.querySelector('.cmt__list');
  if (!list.length){
    ul.innerHTML = '<li class="cmt__empty">还没有评论，来说第一句。</li>';
    return;
  }
  // 新的排前面；评论是用户输入，必须过 esc()
  ul.innerHTML = [...list].reverse().map(c => `
    <li class="cmt__item">
      <div class="cmt__head">
        <span class="cmt__name">${esc(c.user)}</span>
        <time class="cmt__time">${esc(c.at)}</time>
      </div>
      <p class="cmt__text">${esc(c.text)}</p>
    </li>`).join('');
}

function updateBadge(){
  const n = (state.year !== '全部' ? 1 : 0) + (state.audit !== '全部' ? 1 : 0);
  const b = $('#filterBadge');
  b.hidden = n === 0;
  b.textContent = String(n);
}

/* ---------- 筛选项 ---------- */
function buildFilters(){
  const years = [...new Set(WORKS.map(w => w.time.slice(0,4)))].sort().reverse();
  const yEl = $('#yearFilters');
  yEl.innerHTML = '<span class="filters__label">年份</span>';
  [['全部', WORKS.length], ...years.map(y => [y, WORKS.filter(w => w.time.startsWith(y)).length])]
    .forEach(([name, n]) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.key = 'year'; b.dataset.value = name;
      b.setAttribute('aria-pressed', String(state.year === name));
      b.innerHTML = `${name}<small>${n}</small>`;
      yEl.appendChild(b);
    });

  const audits = ['全部', ...[...new Set(WORKS.map(w => auditLabel(w.audit.status)))]];
  const aEl = $('#auditFilters');
  aEl.innerHTML = '<span class="filters__label">审核</span>';
  audits.forEach(name => {
    const n = name === '全部' ? WORKS.length : WORKS.filter(w => auditLabel(w.audit.status) === name).length;
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.key = 'audit'; b.dataset.value = name;
    b.setAttribute('aria-pressed', String(state.audit === name));
    b.innerHTML = `${name}<small>${n}</small>`;
    aEl.appendChild(b);
  });
}

/* ---------- 交互 ---------- */
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip){
    state[chip.dataset.key] = chip.dataset.value;
    $$('.chip').forEach(c => { if (c.dataset.key === chip.dataset.key)
      c.setAttribute('aria-pressed', String(c.dataset.value === chip.dataset.value)); });
    render();
    return;
  }

  const act = e.target.closest('[data-act]');
  if (act){
    const card = act.closest('.work');
    const code = card.dataset.code;
    const kind = act.dataset.act;

    if (kind === 'like'){ Store.toggleLike(code); refresh(code); return; }
    if (kind === 'mark'){ Store.toggleMark(code); refresh(code); return; }
    if (kind === 'copy'){ copyWork(code, act); return; }

    // 「展开全文」只展开正文；评论是独立的功能键，两者不联动
    // （评论默认就是折叠的，不该因为看全文被顺带打开）
    if (kind === 'more'){
      const box = card.querySelector('.work__content');
      const open = box.classList.toggle('is-clamped') === false;
      act.textContent = open ? '收起' : '展开全文';
      act.setAttribute('aria-expanded', String(open));
      return;
    }
    if (kind === 'cmt'){
      const cmt = card.querySelector('.cmt');
      const open = cmt.classList.toggle('is-open');
      act.setAttribute('aria-pressed', String(open));
      if (open) cmt.scrollIntoView({ behavior:'smooth', block:'nearest' });
      return;
    }
  }
});

/* 复制全文：把标题和正文（去掉标签的纯文本）拷到剪贴板。
   ⚠️ clipboard API 在部分环境下**既不 resolve 也不 reject**（权限提示被拦、
      页面未聚焦等），直接 await 会永远挂住、按钮也就永远不会变。
      所以加一个 800ms 超时兜底，保证一定有反馈。 */
async function copyWork(code, btn){
  const w = WORKS.find(x => x.code === code);
  if (!w) return;
  const text = `《${w.title}》\n\n${plain(w.content)}`;

  let ok = true;
  try {
    await Promise.race([
      navigator.clipboard.writeText(text),
      new Promise((_, rej) => setTimeout(() => rej(new Error('clipboard timeout')), 800))
    ]);
  } catch {
    ok = legacyCopy(text);           // 退回 execCommand
  }

  const old = btn.textContent;
  btn.textContent = ok ? '已复制' : '复制失败';
  setTimeout(() => { btn.textContent = old; }, 1400);
}

/* 旧方案：建一个隐藏 textarea 选中后 execCommand('copy')。
   返回是否成功，好让调用方给出准确反馈，而不是假装成功。 */
function legacyCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('#filterToggle').addEventListener('click', () => {
  const open = $('#toolbarMore').classList.toggle('is-open');
  $('#filterToggle').setAttribute('aria-expanded', String(open));
});
$('#reset').addEventListener('click', () => {
  Object.assign(state, { q:'', year:'全部', audit:'全部', sort:'time' });
  $('#q').value = ''; $('#sort').value = 'time';
  buildFilters(); render();
});

/* 发表评论 */
document.addEventListener('submit', e => {
  const form = e.target.closest('.cmt__form');
  if (!form) return;
  e.preventDefault();
  const card = form.closest('.work');
  const code = card.dataset.code;
  const hint = form.querySelector('.cmt__hint');
  const text = form.querySelector('textarea').value.trim();
  if (!text){
    hint.textContent = '先写点什么再发表～';
    hint.classList.add('is-warn');
    form.querySelector('textarea').focus();
    return;
  }
  Store.addComment(code, form.querySelector('input').value.trim().slice(0,12), text.slice(0,200));
  form.querySelector('textarea').value = '';
  hint.textContent = '演示版：评论只保存在你自己的浏览器里，别人看不到';
  hint.classList.remove('is-warn');
  refresh(code);
});

/* 就地更新一张卡片的计数与评论，不重绘整个列表（避免丢失展开状态） */
function refresh(code){
  const card = cardOf(code);
  if (!card) return;
  const w = WORKS.find(x => x.code === code);
  const st = Store.of(code);
  // 计数在标题右侧，不在功能键上 —— 所以这里更新的是 .work__counts
  card.querySelector('.work__counts').innerHTML =
    `<span title="点赞数">赞 <b>${likeCount(w)}</b></span><span title="评论数">评 <b>${cmtCount(w)}</b></span>`;
  card.querySelector('[data-act="like"]').setAttribute('aria-pressed', String(st.liked));
  card.querySelector('[data-act="mark"]').setAttribute('aria-pressed', String(!!st.marked));
  renderComments(code);
  applyClamp(code);
}

/* 窗口尺寸变化要重算折叠高度；重绘会丢失展开状态，所以只重算不重绘 */
let _rt;
addEventListener('resize', () => {
  clearTimeout(_rt);
  _rt = setTimeout(() => WORKS.forEach(w => applyClamp(w.code)), 150);
});
buildFilters();
render();
</script>
</body>
</html>
